name: Build Songbook

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tragix-songbook .

      - name: Build Nezbožnej 2025
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/nezboznej/build:/songbook/nezboznej/build" \
            tragix-songbook --variant nezboznej --edition 2025

      - name: Build Zbožnej 2026
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/zboznej/build:/songbook/zboznej/build" \
            tragix-songbook --variant zboznej --edition 2026

      - name: Upload Nezbožnej PDF
        uses: actions/upload-artifact@v4
        with:
          name: nezboznej-2025
          path: nezboznej/build/songbook.pdf

      - name: Upload Zbožnej PDF
        uses: actions/upload-artifact@v4
        with:
          name: zboznej-2026
          path: zboznej/build/songbook.pdf
