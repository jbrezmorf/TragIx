name: Build Songbook

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Check song files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checker
        run: |
          echo "## Song file quality check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=0
          for variant in nezboznej zboznej; do
            echo "### ${variant}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if python scripts/check_songbook.py "${variant}/songs/" \
                --tail "${variant}/tail.tex" 2>&1 | tee -a $GITHUB_STEP_SUMMARY; then
              echo "All clean." >> $GITHUB_STEP_SUMMARY
            else
              FAILED=1
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done

          exit $FAILED

      - name: Run fixer (dry-run)
        if: always()
        run: |
          echo "## Auto-fixer dry run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=0
          for variant in nezboznej zboznej; do
            echo "### ${variant}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            python scripts/fix_songbook.py "${variant}/songs/" --dry-run 2>&1 \
              | tee -a $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Fail if fixer found anything to fix
            if python scripts/fix_songbook.py "${variant}/songs/" --dry-run 2>&1 \
                | grep -q "Would apply"; then
              FAILED=1
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "> **Fix:** run \`python scripts/fix_songbook.py <variant>/songs/\` locally and commit the result." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  build:
    name: Build PDFs
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t tragix-songbook .

      - name: Build Nezbožnej 2025
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/nezboznej/build:/songbook/nezboznej/build" \
            tragix-songbook --variant nezboznej --edition 2025

      - name: Build Zbožnej 2026
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/zboznej/build:/songbook/zboznej/build" \
            tragix-songbook --variant zboznej --edition 2026

      - name: Upload Nezbožnej PDF
        uses: actions/upload-artifact@v6
        with:
          name: nezboznej-2025
          path: nezboznej/build/songbook.pdf

      - name: Upload Zbožnej PDF
        uses: actions/upload-artifact@v6
        with:
          name: zboznej-2026
          path: zboznej/build/songbook.pdf
